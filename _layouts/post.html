---
layout: default
---
<article class="news-article mx-auto">
  <header class="mb-4">
    <span class="badge text-bg-danger mb-3">Breaking News</span>
    <h1 class="display-5 fw-bold lh-sm">{{ page.title }}</h1>
    <p class="text-muted mb-0">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.author %}
        <span class="mx-2">•</span>
        <span>By {{ page.author }}</span>
      {% endif %}
    </p>
  </header>

  {% if page.image %}
    <figure class="mb-4">
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="img-fluid rounded-3 w-100 featured-image" />
    </figure>
  {% endif %}

  <section class="article-content fs-5 lh-lg">{{ content }}</section>
</article>
